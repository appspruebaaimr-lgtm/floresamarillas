<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores Amarillas</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at 50% 48%, #191a10 0%, #090a0f 48%, #030408 100%);
    font-family: Georgia, "Times New Roman", serif;
    color: #fff;
}

/* ============================================================
   ESCENA
   ============================================================ */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 500px;
    overflow: hidden;
}

/* ============================================================
   LUNA
   ============================================================ */

.moon {
    position: absolute;
    width: 58px;
    height: 58px;
    left: 8%;
    top: 7%;

    border-radius: 50%;

    background: #fff4b8;

    box-shadow:
        0 0 12px #fff4b8,
        0 0 30px rgba(255, 231, 120, .35),
        0 0 55px rgba(255, 225, 100, .15);
}

.moon::after {
    content: "";
    position: absolute;

    width: 7px;
    height: 7px;

    right: -3px;
    bottom: -1px;

    border-radius: 50%;

    background: #ffe98b;
}

/* ============================================================
   ESTRELLAS
   ============================================================ */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;
    background: #fff9d9;

    box-shadow: 0 0 6px #fff3a5;
}

.s1 { left: 27%; top: 13%; }
.s2 { left: 21%; top: 28%; }
.s3 { left: 79%; top: 17%; }
.s4 { left: 87%; top: 36%; }
.s5 { left: 73%; top: 48%; }
.s6 { left: 18%; top: 58%; }
.s7 { left: 62%; top: 69%; }
.s8 { left: 83%; top: 74%; }
.s9 { left: 30%; top: 76%; }
.s10 { left: 92%; top: 58%; }

.star.small {
    width: 2px;
    height: 2px;
    opacity: .7;
}

/* ============================================================
   ÁRBOL
   ============================================================ */

.tree {
    position: absolute;

    /*
       EL ÁRBOL AHORA ES PEQUEÑO.
       Todo lo relacionado con las ramas y las flores está
       contenido dentro de este mismo elemento.
    */

    width: min(72vw, 570px);
    height: min(70vh, 540px);

    left: 50%;
    top: 4%;

    transform: translateX(-50%);

    overflow: visible;
}

/* ============================================================
   SVG DEL ÁRBOL
   ============================================================ */

.tree-svg {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;
}

/* Tronco */

.trunk {
    fill: none;

    stroke: #4d2b16;
    stroke-width: 13;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
}

.trunk-light {
    fill: none;

    stroke: #70401e;
    stroke-width: 5;

    stroke-linecap: round;

    opacity: .75;
}

/* Ramas */

.branch {
    fill: none;

    stroke: #583219;
    stroke-width: 8;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter: drop-shadow(0 1px 2px rgba(0,0,0,.45));
}

.branch-light {
    fill: none;

    stroke: #7b4824;
    stroke-width: 3;

    stroke-linecap: round;

    opacity: .8;
}

/* ============================================================
   CORAZÓN DE FLORES
   ============================================================ */

.flowers {
    position: absolute;

    /*
       IMPORTANTE:
       El corazón está dentro del árbol.
       No está colocado por fuera de las ramas.
    */

    width: 82%;
    height: 67%;

    left: 9%;
    top: 14%;

    overflow: visible;
}

/*
   Cada flor se genera dentro del corazón.
*/

.flower {
    position: absolute;

    width: 13px;
    height: 13px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at center,
            #fff3a0 0%,
            #ffd83d 24%,
            #ffc21d 58%,
            #e8a900 100%
        );

    box-shadow:
        0 0 5px rgba(255, 216, 50, .95),
        0 0 12px rgba(255, 199, 30, .45);
}

/*
   Forma de pequeños pétalos alrededor del centro.
*/

.flower::before,
.flower::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 13px;

    left: 2.5px;
    top: 0;

    border-radius: 50%;

    background: #ffd52e;

    transform: rotate(45deg);

    opacity: .9;
}

.flower::after {
    transform: rotate(-45deg);
}

.flower .center {
    position: absolute;

    width: 4px;
    height: 4px;

    left: 4.5px;
    top: 4.5px;

    border-radius: 50%;

    background: #9a6500;

    z-index: 2;
}

/* Algunas flores un poco más pequeñas */

.flower.small {
    width: 10px;
    height: 10px;
}

.flower.small::before,
.flower.small::after {
    width: 6px;
    height: 10px;

    left: 2px;
}

.flower.small .center {
    width: 3px;
    height: 3px;

    left: 3.5px;
    top: 3.5px;
}

/* ============================================================
   LUCES SUELTAS
   ============================================================ */

.glow {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #ffd94c;

    box-shadow:
        0 0 8px #ffd94c,
        0 0 18px rgba(255, 209, 48, .7);

    opacity: .8;

    animation: float 4s ease-in-out infinite;
}

.g1 { left: 13%; top: 69%; animation-delay: .2s; }
.g2 { left: 23%; top: 72%; animation-delay: 1s; }
.g3 { left: 76%; top: 68%; animation-delay: 1.7s; }
.g4 { left: 85%; top: 61%; animation-delay: 2.2s; }
.g5 { left: 67%; top: 79%; animation-delay: .8s; }

@keyframes float {
    0%, 100% {
        transform: translateY(0);
        opacity: .55;
    }

    50% {
        transform: translateY(-7px);
        opacity: 1;
    }
}

/* ============================================================
   TEXTO
   ============================================================ */

.message {
    position: absolute;

    /*
       SUBIDO respecto al borde inferior.
    */

    left: 8%;
    bottom: 8%;

    width: min(430px, 82vw);

    z-index: 20;

    text-shadow:
        0 2px 5px #000,
        0 0 12px rgba(255, 190, 30, .25);
}

.message h1 {
    margin: 0 0 3px 0;

    font-size: clamp(22px, 3.1vw, 31px);
    line-height: 1.05;

    color: #ffd84a;
}

.message p {
    margin: 0;

    font-size: clamp(13px, 1.7vw, 17px);
    line-height: 1.35;

    color: #fff4d0;
}

.heart {
    color: #ff4655;
}

/* ============================================================
   AJUSTES PARA CELULAR
   ============================================================ */

@media (max-width: 600px) {

    .scene {
        min-height: 0;
    }

    .moon {
        width: 42px;
        height: 42px;

        left: 8%;
        top: 6%;
    }

    .moon::after {
        width: 5px;
        height: 5px;
    }

    /*
       ÁRBOL MÁS PEQUEÑO EN CELULAR
    */

    .tree {
        width: 88vw;
        height: 61vh;

        top: 7%;
    }

    /*
       Flores ligeramente más pequeñas
       pero conservando la forma de corazón.
    */

    .flower {
        width: 10px;
        height: 10px;
    }

    .flower::before,
    .flower::after {
        width: 6px;
        height: 10px;

        left: 2px;
    }

    .flower .center {
        width: 3px;
        height: 3px;

        left: 3.5px;
        top: 3.5px;
    }

    .flower.small {
        width: 8px;
        height: 8px;
    }

    .flower.small::before,
    .flower.small::after {
        width: 5px;
        height: 8px;

        left: 1.5px;
    }

    .flower.small .center {
        width: 2px;
        height: 2px;

        left: 3px;
        top: 3px;
    }

    /*
       TEXTO MÁS ARRIBA Y MÁS PEQUEÑO
    */

    .message {
        left: 8%;
        bottom: 7%;

        width: 84%;
    }

    .message h1 {
        font-size: 23px;
    }

    .message p {
        font-size: 14px;
    }
}

/* ============================================================
   CELULARES MUY BAJOS
   ============================================================ */

@media (max-height: 650px) and (max-width: 600px) {

    .tree {
        height: 56vh;
        top: 5%;
    }

    .message {
        bottom: 4%;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- ======================================================
         LUNA
         ====================================================== -->

    <div class="moon"></div>

    <!-- ======================================================

    <div class="stars">
        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
        <div class="star s4"></div>
        <div class="star s5"></div>
        <div class="star s6"></div>
        <div class="star s7"></div>
        <div class="star s8"></div>
        <div class="star s9"></div>

    </div>

    <!-- ======================================================

        <!-- ==================================================

        <svg

            <!-- derecha superior -->

            <path

            />

            <path
                class="branch-light"
                d="
                    M300 225
                    C335 190 370 158 407 123
                    C437 95 459 68 481 41
                "
            />

            <!-- izquierda media -->

            <path
                class="branch"
                d="
                    M300 300

                    C168 211 143 193 120 171
                "
            />

            <path
                class="branch-light"
                d="
                    M300 300
                    C267 278 231 255 195 228
                    C168 210 144 192 121 171

            />

            <!-- derecha media -->

            <path
                class="branch"
                d="
                    M300 300
                    C337 276 371 254 408 225
                    C437 203 462 180 484 154
                "
            />

            <path
                class="branch-light"
                d="
                    M300 300
                    C337 276 371 253 409 225
                    C438 202 463 179 485 154

            />

            <!-- =================================================
                 RAMAS QUE SE METEN DENTRO DEL CORAZÓN
                 ================================================= -->

            <path
                class="branch"
                d="
                    M300 320
                    C273 300 250 287 225 273
                    C202 260 183 244 166 226

            />

            <path
                class="branch"

            <!-- ramas pequeñas -->

            <path

            <path

            />

            <path
                class="branch"
                d="
                    M408 225
                    C428 224 448 217 465 207

            />

        </svg>

        <!-- ==================================================
             CORAZÓN DE FLORES
             ================================================== -->

        <div class="flowers" id="flowers"></div>

    </div>

    <!-- ======================================================
         LUCES
         ====================================================== -->

    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
    <div class="glow g4"></div>
    <div class="glow g5"></div>

    <!-- ======================================================
         MENSAJE
         ====================================================== -->

    <div class="message">

        <h1>Mi nutria tierna.</h1>

        <p>
            Jamás en la vida te faltarán amor, flores y detalles.
            <br>
            Te amo. <span class="heart">❤️</span>
        </p>

    </div>

</div>

<script>

/* ============================================================
   GENERADOR DE FLORES
   ============================================================ */

const container = document.getElementById("flowers");

/*
   Semilla para que las flores mantengan una distribución
   estable y no cambien cada vez que se abre la página.
*/

let seed = 12345;

function random() {

    seed = (seed * 9301 + 49297) % 233280;

    return seed / 233280;
}


/*
   Ecuación paramétrica aproximada del corazón.

   x = 16 sin³(t)
   y = 13 cos(t)
       - 5 cos(2t)
       - 2 cos(3t)
       - cos(4t)
*/

function insideHeart(x, y) {

    const hx = x * 2 - 1;
    const hy = -(y * 2 - 1);

    /*
       Escala del corazón.
    */

    const px = hx * 1.25;
    const py = hy * 1.25;

    const value =
        Math.pow(px * px + py * py - 1, 3)
        -
        px * px * Math.pow(py, 3);

    return value <= 0;
}


/*
   Las flores se generan SOLAMENTE dentro del corazón.
   Además, se evita que sobresalgan demasiado del área
   donde están las ramas.
*/

const flowers = [];

const totalFlowers = 135;

let attempts = 0;

while (flowers.length < totalFlowers && attempts < 10000) {

    attempts++;

    const x = random();
    const y = random();

    /*
       Corazón más ancho arriba y más estrecho abajo.
    */

    if (!insideHeart(x, y)) {
        continue;
    }

    /*
       Mantener las flores dentro del área de las ramas.
       Esto evita que aparezcan completamente separadas
       de la estructura del árbol.
    */

    const centerDistance =
        Math.abs(x - 0.5);

    /*
       En la parte inferior el corazón se estrecha.
    */

    if (y > 0.68 && centerDistance > 0.20) {
        continue;
    }

    flowers.push({
        x,
        y
    });
}


/*
   Crear las flores.
*/

flowers.forEach((pos, index) => {

    const flower = document.createElement("div");

    flower.className =
        "flower" +
        (index % 4 === 0 ? " small" : "");

    flower.style.left =
        (pos.x * 100) + "%";

    flower.style.top =
        (pos.y * 100) + "%";

    /*
       Variación muy pequeña para que no parezcan
       perfectamente uniformes.
    */

    const scale =
        0.82 + random() * 0.38;

    flower.style.transform =
        `translate(-50%, -50%) scale(${scale})`;

    const center = document.createElement("div");

    center.className = "center";

    flower.appendChild(center);

    container.appendChild(flower);
});

</script>

</body>
