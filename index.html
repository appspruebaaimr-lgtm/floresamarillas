<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi nutria tierna</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 50% 48%,
            #1c1c11 0%,
            #0b0c11 48%,
            #030409 100%
        );

    font-family: Georgia, "Times New Roman", serif;
    color: white;
}

/* ============================================================
   ESCENA
   ============================================================ */

.scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}

/* ============================================================
   LUNA
   ============================================================ */

.moon {
    position: absolute;

    width: 58px;
    height: 58px;

    left: 8%;
    top: 7%;

    border-radius: 50%;

    background: #fff4b8;

    box-shadow:
        0 0 12px #fff4b8,
        0 0 30px rgba(255, 231, 120, .35),
        0 0 55px rgba(255, 225, 100, .15);
}

.moon::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    right: -3px;
    bottom: -1px;

    border-radius: 50%;

    background: #ffe98b;
}

/* ============================================================
   ESTRELLAS
   ============================================================ */

.stars {
    position: absolute;
    inset: 0;

    pointer-events: none;
}

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #fff9d9;

    box-shadow: 0 0 6px #fff3a5;
}

.star.small {
    width: 2px;
    height: 2px;

    opacity: .7;
}

.s1 { left: 27%; top: 13%; }
.s2 { left: 21%; top: 28%; }
.s3 { left: 79%; top: 17%; }
.s4 { left: 87%; top: 36%; }
.s5 { left: 73%; top: 48%; }
.s6 { left: 18%; top: 58%; }
.s7 { left: 62%; top: 69%; }
.s8 { left: 83%; top: 74%; }
.s9 { left: 30%; top: 76%; }
.s10 { left: 92%; top: 58%; }

/* ============================================================
   ÁRBOL
   ============================================================ */

.tree {
    position: absolute;

    width: min(72vw, 570px);
    height: min(70vh, 540px);

    left: 50%;
    top: 4%;

    transform: translateX(-50%);

    overflow: visible;
}

/* ============================================================
   SVG / RAMAS
   ============================================================ */

.tree-svg {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;

    z-index: 2;
}

.trunk {
    fill: none;

    stroke: #4d2b16;
    stroke-width: 13;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
}

.trunk-light {
    fill: none;

    stroke: #70401e;
    stroke-width: 5;

    stroke-linecap: round;

    opacity: .75;
}

.branch {
    fill: none;

    stroke: #583219;
    stroke-width: 8;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter: drop-shadow(0 1px 2px rgba(0,0,0,.45));
}

.branch-light {
    fill: none;

    stroke: #7b4824;
    stroke-width: 3;

    stroke-linecap: round;

    opacity: .8;
}

/* ============================================================
   FLORES
   ============================================================ */

.flowers {
    position: absolute;

    width: 82%;
    height: 67%;

    left: 9%;
    top: 14%;

    overflow: visible;

    /*
       MUY IMPORTANTE:

       Las flores están dentro del árbol.
       No son un elemento separado de la estructura.
    */

    z-index: 3;

    pointer-events: none;
}

.flower {
    position: absolute;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    background:
        radial-gradient(
            circle at center,
            #fff3a0 0%,
            #ffd83d 24%,
            #ffc21d 58%,
            #e8a900 100%
        );

    box-shadow:
        0 0 5px rgba(255, 216, 50, .95),
        0 0 12px rgba(255, 199, 30, .45);

    animation:
        bloom .55s cubic-bezier(.2,.8,.2,1) forwards;
}

.flower::before,
.flower::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 13px;

    left: 2.5px;
    top: 0;

    border-radius: 50%;

    background: #ffd52e;

    opacity: .9;
}

.flower::before {
    transform: rotate(45deg);
}

.flower::after {
    transform: rotate(-45deg);
}

.flower .center {
    position: absolute;

    width: 4px;
    height: 4px;

    left: 4.5px;
    top: 4.5px;

    border-radius: 50%;

    background: #9a6500;

    z-index: 2;
}

/* Flores pequeñas */

.flower.small {
    width: 10px;
    height: 10px;
}

.flower.small::before,
.flower.small::after {
    width: 6px;
    height: 10px;

    left: 2px;
}

.flower.small .center {
    width: 3px;
    height: 3px;

    left: 3.5px;
    top: 3.5px;
}

/* ============================================================
   ANIMACIÓN DE FLORES
   ============================================================ */

@keyframes bloom {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    65% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.18);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/*
   Las flores de los DOS HUECOS tienen una animación diferente.

   No aparecen al principio.
   Se agregan mediante JavaScript después de que
   el resto del corazón ya está formado.
*/

.late-flower {
    animation-name: lateBloom;
}

@keyframes lateBloom {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0)
            rotate(-20deg);
    }

    60% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.2)
            rotate(8deg);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);
    }
}

/* ============================================================
   LUCES
   ============================================================ */

.glow {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #ffd94c;

    box-shadow:
        0 0 8px #ffd94c,
        0 0 18px rgba(255, 209, 48, .7);

    opacity: .8;

    animation: float 4s ease-in-out infinite;
}

.g1 { left: 13%; top: 69%; animation-delay: .2s; }
.g2 { left: 23%; top: 72%; animation-delay: 1s; }
.g3 { left: 76%; top: 68%; animation-delay: 1.7s; }
.g4 { left: 85%; top: 61%; animation-delay: 2.2s; }
.g5 { left: 67%; top: 79%; animation-delay: .8s; }

@keyframes float {

    0%,
    100% {
        transform: translateY(0);
        opacity: .55;
    }

    50% {
        transform: translateY(-7px);
        opacity: 1;
    }
}

/* ============================================================
   MENSAJE
   ============================================================ */

.message {
    position: absolute;

    left: 8%;
    bottom: 8%;

    width: min(430px, 82vw);

    z-index: 20;

    text-shadow:
        0 2px 5px #000,
        0 0 12px rgba(255, 190, 30, .25);
}

.message h1 {
    margin: 0 0 3px 0;

    font-size: clamp(22px, 3.1vw, 31px);

    line-height: 1.05;

    color: #ffd84a;
}

.message p {
    margin: 0;

    font-size: clamp(13px, 1.7vw, 17px);

    line-height: 1.35;

    color: #fff4d0;
}

.heart {
    color: #ff4655;
}

/* ============================================================
   MÓVIL
   ============================================================ */

@media (max-width: 600px) {

    .moon {
        width: 42px;
        height: 42px;

        left: 8%;
        top: 6%;
    }

    .moon::after {
        width: 5px;
        height: 5px;
    }

    .tree {
        width: 88vw;
        height: 61vh;

        top: 7%;
    }

    .flower {
        width: 10px;
        height: 10px;
    }

    .flower::before,
    .flower::after {
        width: 6px;
        height: 10px;

        left: 2px;
    }

    .flower .center {
        width: 3px;
        height: 3px;

        left: 3.5px;
        top: 3.5px;
    }

    .flower.small {
        width: 8px;
        height: 8px;
    }

    .flower.small::before,
    .flower.small::after {
        width: 5px;
        height: 8px;

        left: 1.5px;
    }

    .flower.small .center {
        width: 2px;
        height: 2px;

        left: 3px;
        top: 3px;
    }

    .message {
        left: 8%;
        bottom: 7%;

        width: 84%;
    }

    .message h1 {
        font-size: 23px;
    }

    .message p {
        font-size: 14px;
    }
}

/* ============================================================
   PANTALLAS BAJAS
   ============================================================ */

@media (max-height: 650px) and (max-width: 600px) {

    .tree {
        height: 56vh;
        top: 5%;
    }

    .message {
        bottom: 4%;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- ======================================================

    <div class="moon"></div>

    <!-- ======================================================

    <div class="stars">

        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
        <div class="star s4"></div>

    <!-- ======================================================

    <div class="tree">

        <!-- ==================================================

        >

            <!-- RAMA SUPERIOR IZQUIERDA -->

            <path

                "
            />

            <path
                class="branch-light"

            <!-- RAMA SUPERIOR DERECHA -->

            <path

            <!-- RAMA MEDIA IZQUIERDA -->

            <path
                class="branch"
                d="
                    M300 300

            />

            <path
                class="branch-light"

                    M300 300

            />


            <!-- RAMA MEDIA DERECHA -->

            <path
                class="branch"
                d="
                    M300 300

                    C437 203 462 180 484 154
                "
            />

            <path
                class="branch-light"
                d="
                    M300 300
                    C337 276 371 253 409 225
                    C438 202 463 179 485 154
                "
            />


            <!-- =================================================
                 RAMAS INTERNAS

                 Estas son importantes porque quedan visibles
                 entre las flores.
                 ================================================= -->

            <path
                class="branch"
                d="
                    M300 320
                    C273 300 250 287 225 273
                    C202 260 183 244 166 226
                "
            />

            <path
                class="branch"
                d="
                    M300 320

                    C402 255 421 238 439 218
                "
            />


            <!-- RAMAS PEQUEÑAS -->

            <path
                class="branch"

                    M210 137

            />

            <path

            />

            <path

                    M194 229

                "
            />

            <path
                class="branch"
                d="
                    M408 225
                    C428 224 448 217 465 207
                "
            />

        </svg>


        <!-- ==================================================
             FLORES
             ================================================== -->

        <div
            class="flowers"
            id="flowers"
        ></div>

    </div>


    <!-- ======================================================
         LUCES FLOTANTES
         ====================================================== -->

    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
    <div class="glow g4"></div>
    <div class="glow g5"></div>


    <!-- ======================================================
         TEXTO
         ====================================================== -->

    <div class="message">

        <h1>
            Mi nutria tierna.
        </h1>

        <p>
            Jamás en la vida te faltarán amor, flores y detalles.
            <br>
            Te amo. <span class="heart">❤️</span>
        </p>

</div>


<script>

/* ============================================================
   GENERADOR DE FLORES
   ============================================================ */

const container = document.getElementById("flowers");

let seed = 12345;

function random() {

    seed =
        (seed * 9301 + 49297)
        % 233280;

    return seed / 233280;
}


/* ============================================================
   ECUACIÓN DEL CORAZÓN
   ============================================================ */

function insideHeart(x, y) {

    /*
       Convertimos las coordenadas 0..1
       al sistema del corazón.
    */

    const hx = x * 2 - 1;

    const hy = -(y * 2 - 1);

    const px = hx * 1.25;

    const py = hy * 1.25;

    const value =
        Math.pow(
            px * px +
            py * py -
            1,
            3
        )
        -
        px * px *
        Math.pow(py, 3);

    return value <= 0;
}


/* ============================================================
   CREAR UNA FLOR
   ============================================================ */

function createFlower(
    x,
    y,
    index,
    late = false
) {

    const flower =
        document.createElement("div");

    flower.className =
        "flower" +
        (index % 4 === 0 ? " small" : "") +
        (late ? " late-flower" : "");

    flower.style.left =
        (x * 100) + "%";

    flower.style.top =
        (y * 100) + "%";


    /*
       Variación de tamaño.
    */

    const scale =
        0.82 +
        random() * 0.38;


    /*
       Retraso.

       Las flores normales forman el corazón
       progresivamente.
    */

    const delay =
        late
            ? random() * 500
            : index * 13 + random() * 180;


    flower.style.animationDelay =
        delay + "ms";


    flower.style.setProperty(
        "--flower-scale",
        scale
    );


    const center =
        document.createElement("div");

    center.className = "center";

    flower.appendChild(center);

    container.appendChild(flower);
}


/* ============================================================
   PRIMERA FASE
   ============================================================

   Primero llenamos el corazón dejando deliberadamente
   VACÍOS los dos espacios superiores que marcaste.

   Esos espacios no se consideran errores:

   son huecos reservados para la segunda fase.
   ============================================================ */

const totalFlowers = 145;

let flowers = [];

let attempts = 0;

while (
    flowers.length < totalFlowers &&
    attempts < 15000
) {

    attempts++;

    const x = random();
    const y = random();


    /*
       Sólo dentro del corazón.
    */

    if (!insideHeart(x, y)) {
        continue;
    }


    /*
       Reservamos los DOS HUECOS.

       HUECO IZQUIERDO:
       aproximadamente x = .30 / y = .30

       HUECO DERECHO:
       aproximadamente x = .70 / y = .30

       No ponemos flores ahí durante la primera fase.
    */

    const leftHole =
        Math.pow(x - 0.30, 2) +
        Math.pow(y - 0.30, 2)
        <
        0.0105;


    const rightHole =
        Math.pow(x - 0.70, 2) +
        Math.pow(y - 0.30, 2)
        <
        0.0105;


    if (
        leftHole ||
        rightHole
    ) {
        continue;
    }


    /*
       Evitamos que la parte inferior
       se haga demasiado ancha.
    */

    if (
        y > 0.68 &&
        Math.abs(x - 0.5) > 0.20
    ) {
        continue;
    }


    flowers.push({
        x,
        y
    });
}


/* ============================================================
   CREAR LAS FLORES PRINCIPALES
   ============================================================ */

flowers.forEach(
    (pos, index) => {

        createFlower(
            pos.x,
            pos.y,
            index,
            false
        );

    }
);


/* ============================================================
   SEGUNDA FASE:
   LOS DOS HUECOS
   ============================================================

   Aquí está el cambio importante.

   Esperamos a que el corazón esté prácticamente formado.

   DESPUÉS llenamos los dos huecos.

   Así se mantiene el efecto:

       ramas
         ↓
       flores
         ↓
      corazón
         ↓
       huecos
         ↓
     cierre final ❤️
   ============================================================ */

setTimeout(
    () => {

        /*
           -------------------------------
           HUECO IZQUIERDO
           -------------------------------
        */

        const leftHoleFlowers = [

            [0.265, 0.265],
            [0.300, 0.255],
            [0.335, 0.270],

            [0.245, 0.295],
            [0.280, 0.300],
            [0.315, 0.305],
            [0.350, 0.300],

            [0.260, 0.335],
            [0.295, 0.340],
            [0.330, 0.335],

            [0.285, 0.370],
            [0.315, 0.365]

        ];


        /*
           -------------------------------
           HUECO DERECHO
           -------------------------------
        */

        const rightHoleFlowers = [

            [0.665, 0.270],
            [0.700, 0.255],
            [0.735, 0.270],

            [0.650, 0.300],
            [0.685, 0.305],
            [0.720, 0.300],
            [0.750, 0.295],

            [0.670, 0.335],
            [0.705, 0.340],
            [0.740, 0.330],

            [0.685, 0.365],
            [0.715, 0.365]

        ];


        /*
           Primero llenamos el izquierdo.
        */

        leftHoleFlowers.forEach(
            (pos, index) => {

                createFlower(
                    pos[0],
                    pos[1],
                    index,
                    true
                );

            }
        );


        /*
           Y después el derecho,
           ligeramente escalonado.

           Esto evita que ambos huecos aparezcan
           instantáneamente al mismo tiempo.
        */

        setTimeout(
            () => {

                rightHoleFlowers.forEach(
                    (pos, index) => {

                        createFlower(
                            pos[0],
                            pos[1],
                            index + 20,
                            true
                        );

                    }
                );

            },
            420
        );

    },

    /*
       Esperamos aproximadamente 2 segundos.

       Para ese momento el corazón principal
       ya debe estar prácticamente formado.
    */

    2100
);

</script>
